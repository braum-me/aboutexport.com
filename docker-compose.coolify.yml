# Coolify-Deployment (Build Pack "Docker Compose", Compose-Datei: /docker-compose.coolify.yml).
# Kein Host-Port: Coolify verbindet den Container mit dem vorhandenen Traefik (coolify-proxy).
# Domain, HTTPS und Router-Labels setzt Coolify; Werte für ${…} werden in der Coolify-UI gepflegt.
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-info@aboutexport.com}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-600000}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      # App-Logs enthalten keine personenbezogenen Daten; trotzdem begrenzen: max. 5 × 10 MB
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
