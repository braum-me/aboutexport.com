name: CI

# Läuft nur für Pull Requests gegen main (und manuell). Kein Deployment, keine Secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, Lint, Unit, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bewusst keine produktiven SMTP-Zugangsdaten: E2E nutzt den lokalen SMTP-Sink aus playwright.config.ts
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: TypeScript / Astro Check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, Desktop + Mobile)
        run: npm run test:e2e

      - name: Playwright-Traces bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
