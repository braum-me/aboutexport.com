name: CI

# Läuft für Pull Requests gegen main, Pushes auf main (z. B. Merges) und manuell. Kein Deployment, keine Secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, Lint, Unit, Build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bewusst keine produktiven SMTP-Zugangsdaten: E2E nutzt den lokalen SMTP-Sink aus playwright.config.ts
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm audit (Produktionsabhängigkeiten)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript / Astro Check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Unit-Tests (Vitest)
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright, Desktop + Mobile)
        run: npm run test:e2e

      - name: Playwright-Traces bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker-Build + Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build -t aboutexport-website:ci .

      - name: Container starten (gehärtet wie docker-compose.yml, ohne SMTP)
        run: |
          docker run -d --name web -p 127.0.0.1:4321:4321 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true aboutexport-website:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' web | grep -q healthy

      - name: Smoke-Test
        run: deploy/smoke-test.sh http://127.0.0.1:4321

      - name: Container-Logs bei Fehler
        if: failure()
        run: docker logs web
